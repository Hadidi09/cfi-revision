<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#216869">
    <title>Révision CFI U10-U13</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("cfi-u10-u13-theme");
          var systemDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : systemDark
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute(
            "content",
            theme === "dark" ? "#0f1718" : "#216869"
          );
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <button class="brand" type="button" data-route="home" aria-label="Retour à l'accueil">
        <span class="brand-mark" aria-hidden="true">CFI</span>
        <span>
          <strong>Révision U10-U13</strong>
          <small>Certification CFI</small>
        </span>
      </button>

      <div class="topbar-actions">
        <nav class="main-nav" aria-label="Navigation principale">
          <button type="button" data-route="home">Accueil</button>
          <button type="button" data-route="guide">Guide</button>
          <button type="button" data-route="club">Club</button>
          <button type="button" data-route="dashboard">Tableau</button>
          <button type="button" data-route="program">Programme</button>
          <button type="button" data-route="plan">3 jours</button>
          <button type="button" data-route="free">Libre</button>
          <button type="button" data-route="audio">Audio</button>
          <button type="button" data-route="oral-training">Oral</button>
          <button type="button" data-route="themes">Thèmes</button>
          <button type="button" data-route="review">À revoir</button>
          <button type="button" data-route="feedback">Retour</button>
        </nav>

        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
          <span class="theme-toggle-mark" aria-hidden="true"></span>
          <span data-theme-label>Sombre</span>
        </button>
      </div>
    </header>

    <main id="app" class="app-shell" tabindex="-1"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
